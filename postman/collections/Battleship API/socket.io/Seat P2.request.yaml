$kind: socket.io-request
id: b8df182c7284d48809e44f2c
name: Seat P2
description: |-
  The joiner, `P2`. Set the collection variable `roomId` from the `CREATE_ROOM` ack of **Seat P1** first,
  then send `JOIN_ROOM`; see **Seat P1** for the whole sequence. Its fleet stands in columns 0, 2, 4, 6 and 8,
  so P1's saved `FIRE` at (0, 0) hits; P2's saved `FIRE` at (9, 9) misses P1's fleet (rows 0, 2, 4, 6, 8).
url: '{{baseUrl}}'
events:
  - name: STATE
    description: The receiver's snapshot (fog-of-war), after every accepted command; it follows the ack and any SHOT_RESOLVED.
    subscribeOnConnect: true
  - name: SHOT_RESOLVED
    description: A fired turn, for animation; sent to both players before the STATE that reflects it.
    subscribeOnConnect: true
  - name: SERVER_SHUTDOWN
    description: The server is restarting; any match in progress is lost (docs/deployment.md#backend-render).
    subscribeOnConnect: true
settings:
  version: '4'
messages: .resources/Seat P2.resources/messages
order: 4000
