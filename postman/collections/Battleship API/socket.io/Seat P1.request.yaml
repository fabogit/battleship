$kind: socket.io-request
id: 15fa97653dc0f819d3d2f8c1
name: Seat P1
description: |-
  The room creator, `P1`. Connect it together with **Seat P2**, then send the saved messages in this order:

  1. `CREATE_ROOM` (P1): the ack is `{ "ok": true, "roomId": "…", "playerSecret": "…" }`, then a `STATE` in `WAITING_FOR_OPPONENT`.
     Copy `roomId` into the collection variable `roomId`.
  2. `JOIN_ROOM` (P2): both get a `STATE` in `RULES_NEGOTIATION`, with `rules`, `rulesVersion` and `hasConfirmedRules`.
  3. `UPDATE_RULES` (P1): the ack carries the new `rulesVersion` (1), and both confirmations are cleared.
     `CONFIRM_RULES — stale` (P2) still quotes version 0: `STALE_RULES`. `CONFIRM_RULES` from each seat quotes 1;
     the second one starts placement (`PLACEMENT`) with the agreed rules. Edit a `CONFIRM_RULES` message to match
     the current `rulesVersion` when you edit the rules more than once.
  4. `UPDATE_PLACEMENT` and `CONFIRM_PLACEMENT` from each seat; `UNLOCK_PLACEMENT` reverts a confirmed fleet.
     The second confirmation starts a 5-second countdown (`startCountdownMs`); an unlock cancels it. When it runs
     out, both get `DICE_ROLLED` (a d6 per seat, ties rolled again: every round in `rolls`, and the `starter`), then
     a `STATE` in `IN_PROGRESS` with the starter in `currentTurn`: wait for it before firing. A fleet still
     unconfirmed 60 seconds after placement started is completed and locked, and the match starts the same way.
  5. `UPDATE_TARGETS` (optional draft) and `FIRE` from the seat whose turn it is, the starter first: the saved
     messages fire P1 then P2, so send P2's first when P2 starts. Each `FIRE` sends `SHOT_RESOLVED`, then `STATE`, to
     both. Edit the target before firing again: a cell already shot is `INVALID_TARGETS`.
  6. `SET_PAUSED` (P1) while P2 is connected: `NOT_ALLOWED`. Disconnect **Seat P2**: P1 gets a `STATE` with the
     opponent away (`isConnected: false`, `forfeitRemainingMs`) and the match paused. Now `SET_PAUSED — resume`
     and `SET_PAUSED` are accepted, each followed by a `STATE`. After 3 minutes P2's seat is forfeited:
     `GAME_OVER` with reason `DISCONNECT_FORFEIT`.
  7. `LEAVE_ROOM` (P1) during the match: `NOT_ALLOWED` (leaving a match is a surrender, #35).
  8. `CREATE_ROOM` (P1) again: P1 moves to a new room. `LEAVE_ROOM` there frees the seat at once and closes
     the room; before the match it sends the other player, if any, back to `WAITING_FOR_OPPONENT`. Moving on with
     `CREATE_ROOM` or `JOIN_ROOM` from a room still waiting for an opponent closes that room the same way (ADR-0095).

  Every accepted command acks `{ "ok": true }` (plus credentials for `CREATE_ROOM` / `JOIN_ROOM`, `rulesVersion` for `UPDATE_RULES`); a refused one
  `{ "ok": false, "error": "<ErrorCode>" }` and nothing else. `CREATE_ROOM — invalid payload` shows `INVALID_PAYLOAD`.
  The URL carries `protocolVersion` as a query parameter: Postman cannot send the handshake `auth` (ADR-0062).
  It cannot send a `session` either, so a reconnected Postman socket has no seat: reconnect means starting a new room.
  A seat whose socket is gone is kept for 3 minutes, then forfeited; a room closes when its last player leaves or
  forfeits, a waiting one 10 minutes after it started waiting if nobody joins, a finished one 2 minutes after game
  over; a seat still in an expiring room gets `ROOM_CLOSED` with the reason. The server answers `SERVER_FULL` while 50 rooms are open. More than 20 messages in one second from one connection are refused with `RATE_LIMITED`.
  `packages/server/test/postman.test.ts` replays every saved message in this order inside `pnpm test`.
url: '{{baseUrl}}?protocolVersion={{protocolVersion}}'
events:
  - name: STATE
    description: The receiver's snapshot (fog-of-war), after every accepted command; it follows the ack and any SHOT_RESOLVED.
    subscribeOnConnect: true
  - name: SHOT_RESOLVED
    description: A fired turn, for animation; sent to both players before the STATE that reflects it.
    subscribeOnConnect: true
  - name: DICE_ROLLED
    description: The dice roll that starts the match (ADR-0092), a d6 per seat with every tie rolled again; `rolls` lists every round and `starter` fires first. Sent to both players before the STATE in IN_PROGRESS; the first turn's timer starts 3 seconds later.
    subscribeOnConnect: true
  - name: SESSION_REPLACED
    description: A newer socket took this seat (ADR-0014, ADR-0063); a server disconnect follows. Postman cannot send a session, so only the tests and a socket.io-client script trigger it.
    subscribeOnConnect: true
  - name: SERVER_SHUTDOWN
    description: The server is restarting; any match in progress is lost (docs/deployment.md#backend-render).
    subscribeOnConnect: true
  - name: ROOM_CLOSED
    description: The server closed this seat's room, with the reason (`WAITING_TTL`, `GAME_OVER_TTL`); the socket stays connected in no room (ADR-0097).
    subscribeOnConnect: true
settings:
  version: '4'
messages: .resources/Seat P1.resources/messages
order: 3000
queryParams:
  - key: protocolVersion
    value: '{{protocolVersion}}'
