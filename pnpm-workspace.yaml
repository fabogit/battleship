packages:
  - packages/*

# Install scripts of dependencies (pnpm 11 fails the install on any not listed here, ADR D26).
# Only esbuild runs its own (binary check); the others fall back to their prebuilt binaries.
allowBuilds:
  '@parcel/watcher': false
  esbuild: true
  lmdb: false
  msgpackr-extract: false

# Shared dependency versions, referenced as "catalog:" from package.json files.
# TypeScript stays on 6.0.x: Angular 22 and typescript-eslint require >=6.0 <6.1.
catalog:
  '@eslint/js': ^10.0.1
  '@types/node': ^24.19.1
  eslint: ^10.12.0
  # Server and client must stay on the same Socket.io major.
  socket.io: ^4.8.4
  socket.io-client: ^4.8.4
  typescript: ~6.0.3
  typescript-eslint: ^8.71.0
  vitest: ^5.0.3

# Fail the install on a Node version outside the root "engines" range.
engineStrict: true
