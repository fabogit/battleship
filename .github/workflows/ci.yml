name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# Superseded runs on the same PR/branch are cancelled; every push to main still runs.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # Server URL baked into the client bundle; the build fails without it (docs/deployment.md, Frontend).
      SERVER_URL: https://battleship-server-jumc.onrender.com
    steps:
      - uses: actions/checkout@v7

      # pnpm version comes from the "packageManager" field in package.json.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      # Prettier on the whole repo: the pre-commit hook formats staged files but can be skipped (--no-verify).
      - run: pnpm format:check
      # Typecheck, lint and tests read @battleship/core from its sources (ADR-0022): no build needed before them.
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build

  # The browser journeys (docs/development.md#end-to-end-journeys): a local server and the production bundle, never
  # Render. A job of its own, so `ci` keeps its time and a red journey is told apart from a red unit test.
  e2e:
    name: e2e
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Read the Playwright version
        id: playwright
        run: echo "version=$(pnpm --filter @battleship/e2e exec playwright --version | cut -d ' ' -f 2)" >> "$GITHUB_OUTPUT"

      # The browser download, keyed by the Playwright version that expects it.
      - uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      # Skips the download on a cache hit; the system libraries are installed every time (apt is not cached).
      - run: pnpm --filter @battleship/e2e exec playwright install --with-deps chromium

      - run: pnpm e2e

      - name: Upload the report and traces
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            packages/e2e/playwright-report/
            packages/e2e/test-results/
          retention-days: 14
